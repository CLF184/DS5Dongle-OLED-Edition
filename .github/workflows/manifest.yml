name: Update manifest

# Rebuilds latest.json (the configurator app's update feed) from the releases
# published on this repo: after every release, daily, and on demand. Files are
# downloaded and hashed by tools/build_manifest.mjs, so the feed never points
# at a file that doesn't exist or doesn't match.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Selection logic tests
        run: node --test tools/manifest_lib.test.mjs
      - name: Build latest.json from published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Exit 2 = no unified app + firmware release yet: nothing to publish.
        run: node tools/build_manifest.mjs --out latest.json || [ $? -eq 2 ]
      - name: Commit if changed
        run: |
          if [ -f latest.json ] && [ -n "$(git status --porcelain latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest.json
            git commit -m "chore(release): update latest.json"
            git push origin HEAD:master
          else
            echo "latest.json unchanged."
          fi
